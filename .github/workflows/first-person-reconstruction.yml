name: First-person reconstruction checks

on:
  push:
    branches:
      - first-person/**
    paths:
      - test/first-person/**
      - src/openrct2/paint/FirstPerson*.h
      - src/openrct2/paint/FirstPersonRenderer.SmallScenery.inc
      - src/openrct2/paint/FirstPersonRenderer.Core.inc
      - src/openrct2/paint/FirstPersonRenderer.World.inc
      - src/openrct2/paint/FirstPersonRenderer.Paint.inc
      - src/openrct2/paint/FirstPersonRenderer.cpp
      - src/openrct2/paint/Paint.cpp
      - src/openrct2/Context.cpp
      - src/openrct2/entity/EntityTweener.h
      - src/openrct2-ui/FirstPersonController.cpp
      - src/openrct2-ui/drawing/engines/opengl/FirstPersonGLRenderer.cpp
      - src/openrct2-ui/drawing/engines/opengl/FirstPersonGLRenderer.h
      - src/openrct2-ui/drawing/engines/opengl/OpenGLDrawingEngine.cpp
      - .github/workflows/first-person-reconstruction.yml
  pull_request:
    paths:
      - test/first-person/**
      - src/openrct2/paint/FirstPerson*.h
      - src/openrct2/paint/FirstPersonRenderer.SmallScenery.inc
      - src/openrct2/paint/FirstPersonRenderer.Core.inc
      - src/openrct2/paint/FirstPersonRenderer.World.inc
      - src/openrct2/paint/FirstPersonRenderer.Paint.inc
      - src/openrct2/paint/FirstPersonRenderer.cpp
      - src/openrct2/paint/Paint.cpp
      - src/openrct2/Context.cpp
      - src/openrct2/entity/EntityTweener.h
      - src/openrct2-ui/FirstPersonController.cpp
      - src/openrct2-ui/drawing/engines/opengl/FirstPersonGLRenderer.cpp
      - src/openrct2-ui/drawing/engines/opengl/FirstPersonGLRenderer.h
      - src/openrct2-ui/drawing/engines/opengl/OpenGLDrawingEngine.cpp
      - .github/workflows/first-person-reconstruction.yml

permissions:
  contents: read

jobs:
  headless-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install numpy opencv-python-headless trimesh 'shapely>=2.1' scikit-image moderngl glcontext
      - name: Validate first-person OpenGL shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libegl1-mesa-dev libgl1-mesa-dri libgbm1
          python test/first-person/validate_first_person_shaders.py
      - name: Check real-asset parser, registration, and mesh evaluator
        run: python -m unittest discover -s test/first-person -p 'test_*.py' -v
      - name: Exercise exact production small-scenery material bake
        run: python test/first-person/verify_material_bake.py --sanitize

  windows-release:
    name: First-person Windows Release x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PLATFORM: x64
      OPENRCT2_CL_ADDITIONALOPTIONS: /D_SILENCE_CXX20_U8PATH_DEPRECATION_WARNING /wd4267 /U__ENABLE_DISCORD__
    steps:
      - uses: actions/checkout@v4
      - name: Verify and stage portable RenderDoc runtime
        shell: pwsh
        run: ./scripts/stage-first-person-renderdoc.ps1 -OutputDirectory bin
      - name: Compile and link the production renderer and application
        shell: cmd
        run: scripts\vstool.cmd msbuild src\openrct2-win\openrct2-win.vcxproj /t:Build /p:Configuration=Release /p:Platform=x64 /m:1 /p:BuildInParallel=false /p:CL_MPCount=1 /verbosity:minimal
      - name: Retain the tested application
        uses: actions/upload-artifact@v4
        with:
          name: first-person-windows-x64
          path: |
            bin/openrct2.exe
            bin/renderdoc.dll
            bin/renderdoc-LICENSE.md
          if-no-files-found: error

